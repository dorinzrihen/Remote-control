name: Release

# Actions → Release → Run workflow. Bumps the version, tests, builds, signs and publishes the APK.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed (shown in the app's update dialog). Empty = list of commits since the last release.
        required: false
      version:
        description: Version, e.g. 2.0. Empty = next one (1.6 → 1.7).
        required: false
      dry_run:
        description: Dry run (build and check only, publish nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

env:
  # Certificate of keystore/uniremote.jks. Installed phones only accept updates signed with it.
  CERT_SHA256: eee4fda2f81c27135c2df40ea57f2e656bd377798ebc509e1e815a14059587ca

jobs:
  release:
    runs-on: ubuntu-latest
    # The signing key lives in this environment, which only main can use.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bump version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          GRADLE=app/build.gradle.kts
          CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' $GRADLE)
          NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' $GRADLE)
          VERSION=${INPUT_VERSION:-$(echo "$NAME" | awk -F. '{print $1 "." $2 + 1}')}
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Version must look like 1.7, got $VERSION"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && { echo "::error::v$VERSION already exists"; exit 1; }
          LAST=$(git describe --tags --abbrev=0)
          [ -n "$(git rev-list "$LAST"..HEAD)" ] || { echo "::error::Nothing new on main since $LAST"; exit 1; }
          sed -i "s/versionCode = $CODE/versionCode = $((CODE + 1))/; s/versionName = \"$NAME\"/versionName = \"$VERSION\"/" $GRADLE
          if [ -n "$INPUT_NOTES" ]; then echo "$INPUT_NOTES" > notes.md
          else git log --no-merges --format='- %s' "$LAST"..HEAD > notes.md; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing $NAME → $VERSION (versionCode $CODE → $((CODE + 1)))"; cat notes.md

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          mkdir -p keystore
          echo "$KEYSTORE" | base64 -d > keystore/uniremote.jks

      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease

      # Without the keystore the build silently falls back to the debug key, so check before publishing.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "SHA-256 digest: $CERT_SHA256" \
            || { echo "::error::APK is not signed with the UniRemote release key"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk UniRemote.apk

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Version $VERSION" app/build.gradle.kts
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" UniRemote.apk --verify-tag --title "UniRemote $VERSION" --notes-file notes.md
